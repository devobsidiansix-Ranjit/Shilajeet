server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache static files
    location ~* \.(js|css|png|jpg|jpeg|svg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}

